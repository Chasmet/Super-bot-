plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.superbot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.superbot'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
