plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chasmet.superbot'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chasmet.superbot'
        minSdk 21
        targetSdk 34
        versionCode 19
        versionName '1.3.6'
    }

    signingConfigs {
        locked {
            def keyPath = System.getenv('SUPERBOT_KEYSTORE')
            if (keyPath) storeFile file(keyPath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            if (System.getenv('SUPERBOT_KEYSTORE')) signingConfig signingConfigs.locked
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
